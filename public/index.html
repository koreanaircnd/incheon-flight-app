<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b66"><link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css"><title>인천공항 여객기 운항 현황</title>
</head>
<body>
<header><h1>인천국제공항 여객기 운항 현황</h1><p>도착 · 출발 상세 조회</p></header>
<main>
<section id="loginPanel" class="panel"><h2>직원 로그인</h2><input id="accessCode" type="password" placeholder="공용 접속 비밀번호"><button id="loginBtn">로그인</button><p id="loginMsg" class="msg"></p></section>
<section id="appPanel" class="panel" hidden>
<div class="toolbar"><label>조회 날짜 <input type="date" id="date"></label><button id="refreshBtn">새로고침</button></div>
<div class="tabs"><button data-dir="arrival" class="active">도착</button><button data-dir="departure">출발</button></div>
<div class="toolbar"><input id="filter" placeholder="항공사 또는 편명 검색"><select id="terminal"><option value="">전체 터미널</option><option value="P01">제1터미널</option><option value="P02">탑승동</option><option value="P03">제2터미널</option></select></div>
<div id="airlineQuickFilters" class="airline-quick-filters" aria-label="항공사별 빠른 조회"></div>
<p id="status" class="msg">조회 날짜를 선택해 주세요.</p><div id="results"></div>
</section>
</main><footer>자료 제공: 공공데이터포털 · 운항 정보는 실제 운항 상황에 따라 변경될 수 있습니다.</footer>
<script src="/app.js"></script>
</body></html>
